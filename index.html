<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>Anonymous Chat</title>
  <style>
    :root {
      --bg-main: #0b0f17;
      --bg-panel: #131a26;
      --bg-card: #1b2434;
      --bg-input: #0e131d;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #273247;
      --app-height: 100vh;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg-main); color: var(--text); height: var(--app-height); width: 100%; overflow: hidden; position: fixed; top: 0; left: 0; }

    .hidden { display: none !important; }
    .btn { border: none; border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 13px; cursor: pointer; color: #fff; background: var(--accent); transition: 0.15s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); }
    .btn-success { background: var(--success); }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
    input, select { width: 100%; background: var(--bg-input); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 11px 12px; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: var(--accent); }

    .ig-badge { width: 16px; height: 16px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; vertical-align: middle; }
    .ig-badge svg { width: 16px; height: 16px; display: block; }

    .topbar { height: 58px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; gap: 8px; z-index: 20; flex-shrink: 0; }
    .brand-box { display: flex; flex-direction: column; min-width: 0; }
    .brand-title { font-size: 16px; font-weight: 800; letter-spacing: 0.4px; color: #fff; display: flex; align-items: center; gap: 6px; }
    .brand-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    #authScreen { position: fixed; inset: 0; height: var(--app-height); background: var(--bg-main); z-index: 50; display: flex; flex-direction: column; justify-content: center; padding: 20px; overflow-y: auto; }
    .auth-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 22px; max-width: 420px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .avatar-picker { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 4px 0; }
    .avatar-preview { width: 86px; height: 86px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); background: var(--bg-card); }
    .status-msg { font-size: 12px; min-height: 18px; text-align: center; color: var(--warning); }

    #appScreen { display: flex; flex-direction: column; height: var(--app-height); width: 100%; background: var(--bg-main); overflow: hidden; }
    .main-layout { flex: 1; display: flex; overflow: hidden; position: relative; min-height: 0; }
    .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
    .ttl-banner { background: rgba(59, 130, 246, 0.12); border-bottom: 1px solid rgba(59, 130, 246, 0.25); color: #93c5fd; font-size: 11px; padding: 5px 12px; text-align: center; flex-shrink: 0; }
    #messagesList { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; -webkit-overflow-scrolling: touch; }
    .msg-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; max-width: 86%; align-self: flex-start; word-break: break-word; cursor: pointer; }
    .msg-item.own { background: #172a4a; border-color: #2b4c7e; align-self: flex-end; }
    .msg-reply-box { background: rgba(15, 23, 42, 0.55); border-left: 3px solid var(--accent); padding: 5px 8px; border-radius: 6px; margin-bottom: 6px; font-size: 11px; color: #cbd5e1; }
    .msg-header { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; font-size: 12px; font-weight: 700; }
    .msg-role { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .msg-time { font-size: 10px; color: var(--muted); margin-left: auto; font-weight: 400; }
    .msg-text { font-size: 14px; line-height: 1.42; white-space: pre-wrap; }
    .msg-media { margin-top: 8px; }
    .msg-media img, .msg-media video { max-width: 100%; max-height: 240px; border-radius: 10px; display: block; }
    .msg-media audio { width: 100%; max-width: 260px; margin-top: 4px; }
    .msg-file-card { margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: var(--bg-panel); border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; }
    .msg-file-card a { color: #60a5fa; text-decoration: none; font-weight: 600; flex-shrink: 0; }
    .msg-footer-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
    .msg-reactions { display: flex; flex-wrap: wrap; gap: 4px; }
    .reaction-chip { font-size: 11px; background: rgba(15, 23, 42, 0.65); border: 1px solid var(--border); border-radius: 999px; padding: 1px 6px; }
    .msg-ttl { font-size: 10px; color: var(--muted); margin-left: auto; }

    .composer { background: var(--bg-panel); border-top: 1px solid var(--border); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; z-index: 15; }
    .banner-strip { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: #93c5fd; }
    .composer-row { display: flex; align-items: center; gap: 5px; }
    .composer-row input[type="text"] { flex: 1; padding: 10px 11px; font-size: 14px; min-width: 0; }
    .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-size: 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon-btn.recording { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .drawer-backdrop { position: fixed; inset: 0; height: var(--app-height); background: rgba(0, 0, 0, 0.65); z-index: 40; display: flex; justify-content: flex-end; }
    .drawer-panel { width: 100%; max-width: 390px; height: 100%; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .drawer-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 15px; }
    .drawer-body { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .section-box { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .section-title { font-size: 13px; font-weight: 700; color: #e2e8f0; }
    .user-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px; border-radius: 10px; background: var(--bg-panel); border: 1px solid var(--border); }
    .user-info { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .user-avatar-sm { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: var(--bg-card); flex-shrink: 0; }
    .user-meta { min-width: 0; }
    .user-name-line { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .user-ip-line { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-actions { display: flex; gap: 4px; flex-shrink: 0; }

    .msg-modal-backdrop { position: fixed; inset: 0; height: var(--app-height); background: rgba(0, 0, 0, 0.65); z-index: 60; display: flex; align-items: center; justify-content: center; padding: 18px; }
    .msg-modal-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 8px; }
    .reaction-picker { display: flex; justify-content: space-around; padding: 6px 0; }
    .reaction-pick-btn { font-size: 20px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; width: 42px; height: 42px; cursor: pointer; }

    #banScreen { position: fixed; inset: 0; height: var(--app-height); background: #18080a; color: #fecaca; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 12px; }
  </style>
</head>
<body>

  <div id="banScreen" class="hidden">
    <h2>Erişim Engellendi</h2>
    <p>IP adresiniz yönetici tarafından yasaklandı.</p>
    <p id="bannedIpDisplay" style="font-size:12px; opacity:0.75;"></p>
  </div>

  <div id="authScreen">
    <div class="auth-card" id="registerBox">
      <div style="text-align:center;">
        <div style="font-size:20px; font-weight:800;">Anonymous Chat</div>
        <div style="font-size:12px; color:var(--muted); margin-top:2px;">İsim ve profil fotoğrafı seçerek anında katıl</div>
      </div>

      <div class="avatar-picker">
        <img id="regAvatarPreview" class="avatar-preview" src="" alt="Avatar" />
        <input type="file" id="regAvatarInput" accept="image/*" class="hidden" />
        <button type="button" class="btn btn-secondary btn-sm" id="regPickAvatarBtn">Galeriden Fotoğraf Seç</button>
      </div>

      <div>
        <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:5px;">Kullanıcı Adın</label>
        <input type="text" id="regNameInput" maxlength="24" placeholder="Örn: Karanlık" />
      </div>

      <button type="button" class="btn" id="registerBtn">Kaydı Tamamla ve Gir</button>
      <div id="authStatus" class="status-msg"></div>

      <hr style="border:none; border-top:1px solid var(--border); margin:2px 0;" />

      <button type="button" class="btn btn-secondary" id="openAdminLoginBtn">Admin Girişi</button>
    </div>

    <div class="auth-card hidden" id="adminLoginBox">
      <div style="text-align:center;">
        <div style="font-size:18px; font-weight:800;">Admin Girişi</div>
        <div style="font-size:12px; color:var(--muted); margin-top:2px;">Yönetici kimlik bilgilerini gir</div>
      </div>

      <div>
        <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:5px;">Kullanıcı Adı</label>
        <input type="text" id="adminUserInput" placeholder="Admin kullanıcı adı" />
      </div>

      <div>
        <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:5px;">Şifre</label>
        <input type="password" id="adminPassInput" placeholder="Şifre" />
      </div>

      <button type="button" class="btn btn-success" id="adminLoginSubmitBtn">Yönetici Olarak Giriş Yap</button>
      <button type="button" class="btn btn-secondary" id="backToRegisterBtn">Geri Dön</button>
      <div id="adminLoginStatus" class="status-msg"></div>
    </div>
  </div>

  <div id="appScreen" class="hidden">
    <header class="topbar">
      <div class="brand-box">
        <div class="brand-title">
          <span>Anonymous Chat</span>
        </div>
        <div class="brand-sub" id="groupMetaText">Sohbet Odası • 0 üye • Bağlanıyor</div>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="openMembersBtn">Üyeler</button>
        <button type="button" class="btn btn-secondary btn-sm" id="openProfileBtn">Profil</button>
        <button type="button" class="btn btn-danger btn-sm hidden" id="openAdminBtn">Admin</button>
      </div>
    </header>

    <div id="ttlBanner" class="ttl-banner hidden"></div>

    <div class="main-layout">
      <div class="chat-area">
        <div id="messagesList"></div>

        <div class="composer">
          <div id="replyBar" class="banner-strip hidden">
            <span id="replyLabel">Yanıtlanıyor...</span>
            <button type="button" class="btn btn-secondary btn-sm" id="clearReplyBtn">✕</button>
          </div>

          <div id="attachmentBar" class="banner-strip hidden">
            <span id="attachmentLabel">Dosya seçildi</span>
            <button type="button" class="btn btn-danger btn-sm" id="clearAttachmentBtn">İptal</button>
          </div>

          <div class="composer-row">
            <input type="file" id="mediaFileInput" accept="image/*,video/*" class="hidden" />
            <input type="file" id="docFileInput" accept=".pdf,.doc,.docx,.txt,.zip,.rar,.csv,.json,.apk" class="hidden" />
            <button type="button" class="icon-btn" id="pickMediaBtn" title="Fotoğraf / Video">🖼</button>
            <button type="button" class="icon-btn" id="pickDocBtn" title="Dosya Gönder">📎</button>
            <button type="button" class="icon-btn" id="recordAudioBtn" title="Ses Kaydı">🎤</button>
            <input type="text" id="messageTextInput" placeholder="Mesaj yaz..." />
            <button type="button" class="btn" id="sendMsgBtn">Gönder</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="drawerBackdrop" class="drawer-backdrop hidden">
    <div class="drawer-panel" onclick="event.stopPropagation()">
      <div class="drawer-header">
        <span id="drawerTitle">Panel</span>
        <button type="button" class="btn btn-secondary btn-sm" id="closeDrawerBtn">Kapat</button>
      </div>
      <div id="drawerBody" class="drawer-body"></div>
    </div>
  </div>

  <div id="msgModalBackdrop" class="msg-modal-backdrop hidden">
    <div class="msg-modal-card" onclick="event.stopPropagation()">
      <div style="font-weight:700; font-size:14px; text-align:center;">Mesaj İşlemleri</div>
      <div class="reaction-picker">
        <button type="button" class="reaction-pick-btn" data-emoji="👍">👍</button>
        <button type="button" class="reaction-pick-btn" data-emoji="❤️">❤️</button>
        <button type="button" class="reaction-pick-btn" data-emoji="😂">😂</button>
        <button type="button" class="reaction-pick-btn" data-emoji="🔥">🔥</button>
      </div>
      <button type="button" class="btn btn-secondary" id="modalReplyBtn">Yanıtla</button>
      <button type="button" class="btn btn-secondary" id="modalDeleteForMeBtn">Benden Sil</button>
      <button type="button" class="btn btn-danger hidden" id="modalUnsendBtn">Herkesten Geri Çek</button>
      <button type="button" class="btn btn-secondary" id="modalCloseBtn">İptal</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc,
      collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, getDocs, where
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // FIREBASE YAPILANDIRMASI (KENDİ PROJENİN BİLGİLERİ)
    const firebaseConfig = {
      apiKey: "AIzaSyA7xwLf-o-vRRRs7f95acj74C4ByFod6YU",
      authDomain: "xgram-5c54d.firebaseapp.com",
      projectId: "xgram-5c54d",
      storageBucket: "xgram-5c54d.firebasestorage.app",
      messagingSenderId: "316745732411",
      appId: "1:316745732411:web:bd6b3dc4e39106a249671e",
      measurementId: "G-HYZ5DNQG8N"
    };

    const ADMIN_CREDENTIALS = {
      username: "Rewix",
      password: "05538238212a"
    };

    const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
        <rect width="120" height="120" fill="#1e293b"/>
        <circle cx="60" cy="46" r="22" fill="#475569"/>
        <path d="M22 106c4-22 20-34 38-34s34 12 38 34" fill="#475569"/>
      </svg>
    `);

    const IG_VERIFIED_SVG = `
      <span class="ig-badge" title="Doğrulanmış Hesap">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#1D9BF0" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34z"/>
          <path fill="#FFFFFF" d="M10.4 16.2l-3.2-3.2 1.4-1.4 1.8 1.8 4.8-4.8 1.4 1.4-6.2 6.2z"/>
        </svg>
      </span>
    `;

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const DEVICE_KEY = "xgram_anon_device_id";
    const LOCAL_USER_KEY = "xgram_anon_local_user";
    const LOCAL_ADMIN_KEY = "xgram_anon_is_admin";
    const HIDDEN_MSGS_KEY = "xgram_anon_hidden_msgs";

    const safeStorage = {
      getItem(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
      setItem(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
      removeItem(k) { try { localStorage.removeItem(k); } catch (_) {} }
    };

    let deviceId = safeStorage.getItem(DEVICE_KEY);
    if (!deviceId) {
      deviceId = "dev_" + Math.random().toString(36).slice(2, 12) + "_" + Date.now().toString(36);
      safeStorage.setItem(DEVICE_KEY, deviceId);
    }

    let hiddenMsgIds = new Set(JSON.parse(safeStorage.getItem(HIDDEN_MSGS_KEY) || "[]"));
    let currentIp = "unknown";
    let currentUser = null;
    let isAdminLoggedIn = safeStorage.getItem(LOCAL_ADMIN_KEY) === "1";
    let isCloudConnected = false;
    let groupConfig = {
      activeGroupId: "group_main",
      groupName: "Sohbet Odası",
      autoDeleteSeconds: 0,
      updatedAt: Date.now()
    };
    let allUsers = [];
    let currentMessages = [];
    let messagesUnsub = null;
    let selectedRegAvatarDataUrl = DEFAULT_AVATAR;
    let pendingAttachment = null;
    let replyingToMsg = null;
    let selectedMsgForModal = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordingStream = null;
    let groupListenerStarted = false;
    let usersListenerStarted = false;
    let subscriptionActiveGroupId = null;

    const banScreen = document.getElementById("banScreen");
    const bannedIpDisplay = document.getElementById("bannedIpDisplay");
    const authScreen = document.getElementById("authScreen");
    const appScreen = document.getElementById("appScreen");
    const registerBox = document.getElementById("registerBox");
    const adminLoginBox = document.getElementById("adminLoginBox");
    const regAvatarPreview = document.getElementById("regAvatarPreview");
    const regAvatarInput = document.getElementById("regAvatarInput");
    const regNameInput = document.getElementById("regNameInput");
    const authStatus = document.getElementById("authStatus");
    const adminLoginStatus = document.getElementById("adminLoginStatus");
    const groupMetaText = document.getElementById("groupMetaText");
    const ttlBanner = document.getElementById("ttlBanner");
    const openAdminBtn = document.getElementById("openAdminBtn");
    const messagesList = document.getElementById("messagesList");
    const messageTextInput = document.getElementById("messageTextInput");
    const mediaFileInput = document.getElementById("mediaFileInput");
    const docFileInput = document.getElementById("docFileInput");
    const attachmentBar = document.getElementById("attachmentBar");
    const attachmentLabel = document.getElementById("attachmentLabel");
    const replyBar = document.getElementById("replyBar");
    const replyLabel = document.getElementById("replyLabel");
    const recordAudioBtn = document.getElementById("recordAudioBtn");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const drawerTitle = document.getElementById("drawerTitle");
    const drawerBody = document.getElementById("drawerBody");
    const msgModalBackdrop = document.getElementById("msgModalBackdrop");
    const modalUnsendBtn = document.getElementById("modalUnsendBtn");

    regAvatarPreview.src = DEFAULT_AVATAR;

    function syncViewportHeight() {
      const vv = window.visualViewport;
      const h = vv ? vv.height : window.innerHeight;
      document.documentElement.style.setProperty("--app-height", `${Math.round(h)}px`);
      if (messagesList) messagesList.scrollTop = messagesList.scrollHeight;
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncViewportHeight);
      window.visualViewport.addEventListener("scroll", syncViewportHeight);
    }
    window.addEventListener("resize", syncViewportHeight);
    syncViewportHeight();

    messageTextInput.addEventListener("focus", () => {
      setTimeout(() => { syncViewportHeight(); messagesList.scrollTop = messagesList.scrollHeight; }, 180);
    });

    function persistHiddenMsgs() {
      try { safeStorage.setItem(HIDDEN_MSGS_KEY, JSON.stringify([...hiddenMsgIds])); } catch (_) {}
    }

    function withTimeout(promise, ms = 8000) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))
      ]);
    }

    function escapeHtml(str) {
      return String(str || "").replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[m]));
    }

    function verifiedBadgeHtml(show) { return show ? IG_VERIFIED_SVG : ""; }
    function canSendMessage() { return Boolean(currentUser && (currentUser.id || isAdminLoggedIn)); }

    function saveLocalUser(u) {
      try { if (u) safeStorage.setItem(LOCAL_USER_KEY, JSON.stringify(u)); else safeStorage.removeItem(LOCAL_USER_KEY); } catch (_) {}
    }
    function loadLocalUser() {
      try { const raw = safeStorage.getItem(LOCAL_USER_KEY); return raw ? JSON.parse(raw) : null; } catch (_) { return null; }
    }

    async function fetchPublicIp() {
      try {
        const r = await withTimeout(fetch("https://api.ipify.org?format=json", { cache: "no-store" }), 4000);
        const j = await r.json();
        if (j && j.ip) return j.ip.trim();
      } catch (_) {}
      return "ip_" + deviceId.slice(-8);
    }

    function fileToDataUrl(file, maxWidth = 640, quality = 0.72) {
      return new Promise((resolve, reject) => {
        if (file.type.startsWith("image/")) {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              const scale = Math.min(1, maxWidth / img.width);
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, Math.round(img.width * scale));
              canvas.height = Math.max(1, Math.round(img.height * scale));
              canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.onerror = reject;
            img.src = ev.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        } else {
          if (file.size > 650 * 1024) { reject(new Error("Dosya boyutu çok büyük (maksimum 650 KB destekleniyor).")); return; }
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        }
      });
    }

          onSnapshot(collection(db, "users"), async (snap) => {
            isCloudConnected = true;

            snap.forEach((d) => list.push({ id: d.id, ...d.data() }));

    function formatDuration(sec) {
      if (sec < 60) return `${sec} saniye`;
      if (sec < 3600) return `${Math.round(sec / 60)} dakika`;
      return `${Math.round(sec / 3600)} saat`;
    }
    function formatClock(ms) {
      if (!ms) return "";
      return new Date(ms).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
    }

    function subscribeToMessages(groupId) {
      if (!groupId) return;
      if (subscriptionActiveGroupId === groupId && messagesUnsub) return;
      if (messagesUnsub) { messagesUnsub(); messagesUnsub = null; }
      subscriptionActiveGroupId = groupId;

      try {
        const q = query(collection(db, "groups", groupId, "messages"), orderBy("createdAtMs", "asc"));
        messagesUnsub = onSnapshot(q, (snap) => {
          isCloudConnected = true;
          updateTopBarAndTtl();
          const now = Date.now();
          const docsToRender = [];
          snap.forEach((docSnap) => {
            const m = { id: docSnap.id, ...docSnap.data() };
            if (m.expiresAtMs && now >= m.expiresAtMs) {
              deleteDoc(doc(db, "groups", groupId, "messages", m.id)).catch(() => {});
            } else if (!hiddenMsgIds.has(m.id)) {
              docsToRender.push(m);
            }
          });
          currentMessages = docsToRender;
          renderMessages(docsToRender);
        }, (err) => {
          console.warn("messages listener hatası:", err.code, err.message);
          isCloudConnected = false;
          updateTopBarAndTtl();
          renderMessages(currentMessages);
        });
      } catch (err) {
        console.warn("subscribeToMessages kurulamadı:", err.message);
        renderMessages(currentMessages);
      }
    }

    setInterval(async () => {
      if (!currentUser || !groupConfig.activeGroupId) return;
      try {
        const now = Date.now();
        const snap = await getDocs(collection(db, "groups", groupConfig.activeGroupId, "messages"));
        snap.forEach((d) => {
          const data = d.data();
          if (data.expiresAtMs && now >= data.expiresAtMs) {
            deleteDoc(doc(db, "groups", groupConfig.activeGroupId, "messages", d.id)).catch(() => {});
          }

    function renderMessages(msgs) {
      const wasAtBottom = messagesList.scrollHeight - messagesList.scrollTop - messagesList.clientHeight < 90;
      messagesList.innerHTML = "";
      if (!msgs || msgs.length === 0) {
        messagesList.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:13px; margin-top:24px;">Henüz mesaj yok. İlk mesajı sen gönder.</div>`;
        return;
      }
      const now = Date.now();
      msgs.forEach((m) => {
        const isOwn = currentUser && m.senderId === currentUser.id;
        const senderLive = allUsers.find((u) => u.id === m.senderId);
        const senderName = senderLive ? senderLive.name : (m.senderName || "Üye");
        const isVerified = senderLive ? Boolean(senderLive.verified || senderLive.isAdmin) : Boolean(m.verified);
        const isAdminBadge = senderLive ? Boolean(senderLive.isAdmin) : Boolean(m.isAdmin);
        const div = document.createElement("div");
        div.className = "msg-item" + (isOwn ? " own" : "");
        div.onclick = () => openMessageModal(m);
        let replyHtml = "";
        if (m.replyTo && m.replyTo.senderName) {
          replyHtml = `<div class="msg-reply-box"><strong>${escapeHtml(m.replyTo.senderName)}:</strong> ${escapeHtml(m.replyTo.text || "Medya / Dosya")}</div>`;
        }
        let mediaHtml = "";
        if (m.mediaType === "image" && m.mediaData) mediaHtml = `<div class="msg-media"><img src="${m.mediaData}" alt="Görsel" /></div>`;
        else if (m.mediaType === "video" && m.mediaData) mediaHtml = `<div class="msg-media"><video src="${m.mediaData}" controls playsinline></video></div>`;
        else if (m.mediaType === "audio" && m.mediaData) mediaHtml = `<div class="msg-media"><audio src="${m.mediaData}" controls></audio></div>`;
        else if (m.mediaType === "file" && m.mediaData) mediaHtml = `<div class="msg-file-card" onclick="event.stopPropagation()"><span>📄 ${escapeHtml(m.fileName || "Dosya")}</span><a href="${m.mediaData}" download="${escapeHtml(m.fileName || "dosya")}">İndir</a></div>`;
        const reactionsObj = m.reactions || {};
        const reactionChips = Object.entries(reactionsObj)
          .filter(([, users]) => Array.isArray(users) && users.length > 0)
          .map(([emoji, users]) => `<span class="reaction-chip">${emoji} ${users.length}</span>`).join("");
        let remainingHtml = "";
        if (m.expiresAtMs) {
          const remSec = Math.max(0, Math.ceil((m.expiresAtMs - now) / 1000));
          remainingHtml = `<span class="msg-ttl">⏱ ${remSec} sn</span>`;
        }
        div.innerHTML = `
          ${replyHtml}
          <div class="msg-header">
            <span>${escapeHtml(senderName)}</span>
            ${verifiedBadgeHtml(isVerified)}
            ${isAdminBadge ? `<span class="msg-role">ADMIN</span>` : ""}
            <span class="msg-time">${formatClock(m.createdAtMs)}</span>
          </div>
          ${m.text ? `<div class="msg-text">${escapeHtml(m.text)}</div>` : ""}
          ${mediaHtml}
          <div class="msg-footer-row"><div class="msg-reactions">${reactionChips}</div>${remainingHtml}</div>
        `;
        messagesList.appendChild(div);
      });
      if (wasAtBottom) messagesList.scrollTop = messagesList.scrollHeight;
    }

      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        try {
          recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(recordingStream);
          audioChunks = [];
          mediaRecorder.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) audioChunks.push(ev.data); };
          mediaRecorder.onstop = () => {
            const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
            const reader = new FileReader();
            reader.onload = () => {
              pendingAttachment = { type: "audio", name: "Ses Kaydı", data: reader.result };
              attachmentBar.classList.remove("hidden");
              attachmentLabel.textContent = "Ses kaydı eklendi";
            };
            reader.readAsDataURL(blob);
            if (recordingStream) recordingStream.getTracks().forEach((t) => t.stop());
          };
          mediaRecorder.start();
          recordAudioBtn.classList.add("recording");
          recordAudioBtn.textContent = "⏹";
        } catch (_) { alert("Mikrofon izni verilmedi veya desteklenmiyor."); }

    async function sendMessage() {

      const text = messageTextInput.value.trim();
      if (!text && !pendingAttachment) return;
      const ttlSec = Number(groupConfig.autoDeleteSeconds || 0);
      const now = Date.now();
      const payload = {
        senderId: currentUser.id,
        senderName: currentUser.name,
        verified: Boolean(currentUser.verified || currentUser.isAdmin || isAdminLoggedIn),
        isAdmin: Boolean(currentUser.isAdmin || isAdminLoggedIn),
        text,
        fileName: pendingAttachment ? pendingAttachment.name : null,
        mediaType: pendingAttachment ? pendingAttachment.type : null,
        mediaData: pendingAttachment ? pendingAttachment.data : null,
        replyTo: replyingToMsg ? { ...replyingToMsg } : null,
        reactions: {},
        createdAtMs: now,
        createdAt: serverTimestamp(),
        expiresAtMs: ttlSec > 0 ? now + ttlSec * 1000 : null
      };
      messageTextInput.value = "";
      const attBackup = pendingAttachment;
      const replyBackup = replyingToMsg;
      pendingAttachment = null;
      replyingToMsg = null;
      attachmentBar.classList.add("hidden");
      replyBar.classList.add("hidden");
      try {
        await addDoc(collection(db, "groups", groupConfig.activeGroupId, "messages"), payload);
        isCloudConnected = true;
        updateTopBarAndTtl();
      } catch (err) {
        pendingAttachment = attBackup;
        replyingToMsg = replyBackup;
        if (attBackup) attachmentBar.classList.remove("hidden");
        if (replyBackup) replyBar.classList.remove("hidden");
        alert("Mesaj gönderilemedi: " + err.message);
      }
    }

                    <div class="user-name-line">
                      <span>${escapeHtml(u.name || "İsimsiz")}</span>
                      ${verifiedBadgeHtml(u.verified || u.isAdmin)}
                      ${u.isAdmin ? `<span class="msg-role">ADMIN</span>` : ""}
                    </div>
                    <div class="user-ip-line">${escapeHtml(ipText)}</div>
                  </div>
                </div>
              </div>`;
          }).join("")}
        </div>`;
    }

    function renderProfileDrawer() {
      if (!currentUser) return;
      let tempAvatar = currentUser.avatar || DEFAULT_AVATAR;
      drawerBody.innerHTML = `
        <div class="section-box" style="align-items:center;">
          <img id="editAvatarImg" class="avatar-preview" src="${tempAvatar}" alt="" />
          <input type="file" id="editAvatarFile" accept="image/*" class="hidden" />
          <button type="button" class="btn btn-secondary btn-sm" id="editAvatarPickBtn">Fotoğrafı Değiştir</button>
          <div style="width:100%; margin-top:6px;">
            <label style="font-size:12px; color:var(--muted); display:block; margin-bottom:4px;">İsim</label>
            <input type="text" id="editNameInput" maxlength="24" value="${escapeHtml(currentUser.name || "")}" />
          </div>
          <button type="button" class="btn" id="saveProfileBtn" style="width:100%;">Profili Kaydet</button>
        </div>
        <div class="section-box">
          <div class="section-title" style="color:#fca5a5;">Hesap Silme</div>
          <p style="font-size:12px; color:var(--muted);">Hesabını kalıcı olarak silersen tekrar kayıt ekranına dönersin.</p>
          <button type="button" class="btn btn-danger" id="deleteMyAccountBtn">Hesabımı Sil</button>
        </div>`;
      document.getElementById("editAvatarPickBtn").onclick = () => document.getElementById("editAvatarFile").click();
      document.getElementById("editAvatarFile").onchange = async (e) => {
        const f = e.target.files[0]; if (!f) return;
        tempAvatar = await fileToDataUrl(f, 240, 0.72);
        document.getElementById("editAvatarImg").src = tempAvatar;
      };
      document.getElementById("saveProfileBtn").onclick = async () => {
        const newName = document.getElementById("editNameInput").value.trim();
        if (!newName) return alert("İsim boş olamaz.");
        currentUser.name = newName;
        currentUser.avatar = tempAvatar;
        saveLocalUser(currentUser);
        updateDoc(doc(db, "users", currentUser.id), { name: newName, avatar: tempAvatar, lastSeen: Date.now() }).catch(() => {});
        alert("Profil güncellendi.");
        drawerBackdrop.classList.add("hidden");
      };
      document.getElementById("deleteMyAccountBtn").onclick = async () => {
        if (!confirm("Hesabını silmek istediğine emin misin?")) return;
        const targetId = currentUser.id;
        currentUser = null;
        isAdminLoggedIn = false;
        saveLocalUser(null);
        safeStorage.removeItem(LOCAL_ADMIN_KEY);
        openAdminBtn.classList.add("hidden");
        deleteDoc(doc(db, "users", targetId)).catch(() => {});
        drawerBackdrop.classList.add("hidden");
        showAuthScreen();
      };
    }

    function renderAdminDrawer() {
      const currentTtl = Number(groupConfig.autoDeleteSeconds || 0);
      drawerBody.innerHTML = `
        <div class="section-box">
          <div class="section-title">Grubu Sil ve Yeni Grup Aç</div>
          <p style="font-size:12px; color:var(--muted);">Mevcut gruptaki mesajlar temizlenir, yeni grup açılır ve tüm kullanıcılar otomatik yeni gruba geçer.</p>
          <input type="text" id="newGroupNameInput" placeholder="Yeni grup adı (Örn: Sohbet Odası V2)" value="${escapeHtml(groupConfig.groupName || "")}" />
          <button type="button" class="btn btn-danger" id="recreateGroupBtn">Mevcut Grubu Sil & Yeni Grup Aç</button>
        </div>
        <div class="section-box">
          <div class="section-title">Otomatik Mesaj Silme Zamanlayıcısı</div>
          <select id="autoDeleteSelect">
            <option value="0" ${currentTtl === 0 ? "selected" : ""}>Kapalı (Mesajlar silinmez)</option>
            <option value="10" ${currentTtl === 10 ? "selected" : ""}>10 Saniye</option>
            <option value="30" ${currentTtl === 30 ? "selected" : ""}>30 Saniye</option>
            <option value="60" ${currentTtl === 60 ? "selected" : ""}>1 Dakika</option>
            <option value="300" ${currentTtl === 300 ? "selected" : ""}>5 Dakika</option>
            <option value="3600" ${currentTtl === 3600 ? "selected" : ""}>1 Saat</option>
            <option value="86400" ${currentTtl === 86400 ? "selected" : ""}>24 Saat</option>
          </select>
          <button type="button" class="btn btn-success" id="saveTtlBtn">Zamanlayıcıyı Kaydet</button>
        </div>
        <div class="section-box">
          <div class="section-title">Kullanıcı Yönetimi (Mavi Tik & IP Ban)</div>
          ${allUsers.map((u) => {
            const hasTik = Boolean(u.verified || u.isAdmin);
            return `
              <div class="user-row">
                <div class="user-info">
                  <img class="user-avatar-sm" src="${u.avatar || DEFAULT_AVATAR}" alt="" />
                  <div class="user-meta">
                    <div class="user-name-line">
                      <span>${escapeHtml(u.name || "İsimsiz")}</span>
                      ${verifiedBadgeHtml(hasTik)}
                    </div>
                    <div class="user-ip-line">IP: ${escapeHtml(u.ip || "-")}</div>
                  </div>
                </div>
                <div class="user-actions">
                  <button type="button" class="btn btn-secondary btn-sm toggle-tik-btn" data-uid="${u.id}" data-tik="${hasTik ? "1" : "0"}">
                    ${hasTik ? "Tik Al" : "Tik Ver"}
                  </button>
                  ${!u.isAdmin ? `<button type="button" class="btn btn-danger btn-sm ip-ban-btn" data-uid="${u.id}" data-ip="${escapeHtml(u.ip || "")}">IP Ban</button>` : ""}
                </div>
              </div>`;
          }).join("")}
        </div>`;
      document.getElementById("recreateGroupBtn").onclick = async () => {
        const newName = document.getElementById("newGroupNameInput").value.trim() || "Yeni Grup";
        if (!confirm("Mevcut grup silinip yeni grup açılsın mı? Tüm kullanıcılar yeni gruba aktarılacak.")) return;
        try {
          const oldMsgsSnap = await getDocs(collection(db, "groups", groupConfig.activeGroupId, "messages"));
          for (const d of oldMsgsSnap.docs) await deleteDoc(doc(db, "groups", groupConfig.activeGroupId, "messages", d.id));
        } catch (_) {}
        const nextGroupId = "grp_" + Date.now();
        await setDoc(doc(db, "groups", nextGroupId, "messages", "_init"), {
          senderId: currentUser.id, senderName: currentUser.name, verified: true, isAdmin: true,
          text: `"${newName}" grubu açıldı.`, createdAtMs: Date.now(), createdAt: serverTimestamp(), expiresAtMs: null
        });
        await setDoc(doc(db, "config", "group_state"), {
          activeGroupId: nextGroupId, groupName: newName,
          autoDeleteSeconds: Number(groupConfig.autoDeleteSeconds || 0), updatedAt: Date.now()
        }, { merge: true });
        alert("Yeni grup açıldı ve diğer kullanıcılar otomatik yönlendirildi.");
      };
      document.getElementById("saveTtlBtn").onclick = async () => {
        const sec = Number(document.getElementById("autoDeleteSelect").value || 0);
        groupConfig.autoDeleteSeconds = sec;
        updateTopBarAndTtl();
        await setDoc(doc(db, "config", "group_state"), { autoDeleteSeconds: sec, updatedAt: Date.now() }, { merge: true });
        alert("Otomatik mesaj silme ayarı güncellendi.");
      };
      drawerBody.querySelectorAll(".toggle-tik-btn").forEach((btn) => {
        btn.onclick = async () => {
          const uid = btn.getAttribute("data-uid");
          const currentlyHasTik = btn.getAttribute("data-tik") === "1";
          await updateDoc(doc(db, "users", uid), { verified: !currentlyHasTik });
        };
      });
      drawerBody.querySelectorAll(".ip-ban-btn").forEach((btn) => {
        btn.onclick = async () => {
          const uid = btn.getAttribute("data-uid");
          const targetIp = btn.getAttribute("data-ip");
          if (!targetIp || targetIp === "unknown") return alert("Bu kullanıcının geçerli IP bilgisi bulunamadı.");
          if (!confirm(`${targetIp} IP adresini kalıcı olarak banlamak istiyor musun?`)) return;
          await setDoc(doc(db, "banned_ips", encodeURIComponent(targetIp)), { ip: targetIp, bannedBy: currentUser.name, bannedAt: Date.now() });
          await deleteDoc(doc(db, "users", uid));
          alert("IP banlandı ve kullanıcı hesabı kaldırıldı.");
        };
      });
    }

    (async function initApp() {
      currentIp = await fetchPublicIp();
      await ensureGroupDocExists();

      if (await checkIfIpBanned(currentIp) && !isAdminLoggedIn) {
        showBanScreen(currentIp);
        return;
      }

      startRealtimeListeners();

      const cachedUser = loadLocalUser();
      const foundUser = await findExistingAccountForCurrentUser();
      const activeUser = foundUser || cachedUser;

      if (activeUser && activeUser.name) {
        enterApp(activeUser);
      } else {
        showAuthScreen();
      }
    })();
  </script>
</body>
</html>
